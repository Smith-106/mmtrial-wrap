name: mmtrial-wrap
services:
  api:
    build: .
    image: mmtrial-wrap:latest
    ports:
      - "8080:8080"
    environment:
      CDP_HOST: ${CDP_HOST:-host.docker.internal}
      CDP_PORT: ${CDP_PORT:-11611}
      API_KEY: ${API_KEY:-}
      POLL_SECONDS: "7"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
